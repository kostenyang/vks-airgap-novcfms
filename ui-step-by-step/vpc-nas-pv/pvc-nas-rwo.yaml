# 做法 1 驗證：PVC 用 StorageClass vks-nas（vSphere CSI → NAS 上的 NFS datastore nas-vks-ds）
#   PV 是 nas-vks-ds 上的一顆 VMDK（First Class Disk），NFS 流量走 ESXi vmk3（VLAN 7），不經過 VKS 節點網路
#   PSA restricted：非 root + fsGroup 讓 kubelet 把 volume 改成可寫
apiVersion: v1
kind: Namespace
metadata:
  name: nas-demo
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data-on-nas
  namespace: nas-demo
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: vks-nas
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: writer
  namespace: nas-demo
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 1000
    seccompProfile: {type: RuntimeDefault}
  containers:
  - name: c
    image: harbor01.home.lab/vks-apps/busybox:1.37.0
    command: ["sh", "-c", "echo \"hello from NAS PV $(date -u)\" >> /data/hello.txt; df -h /data; cat /data/hello.txt; sleep 3600"]
    volumeMounts:
    - {name: data, mountPath: /data}
    securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
  volumes:
  - name: data
    persistentVolumeClaim: {claimName: data-on-nas}
