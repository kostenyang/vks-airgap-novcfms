# VKS test cluster for the air-gap round (ClusterClass builtin-generic-v3.7.0, CAPI v1beta2)
# pods/services CIDRs chosen to avoid the lab's 192.168.x networks (default pod CIDR 192.168.0.0/16 would overlap).
apiVersion: cluster.x-k8s.io/v1beta2
kind: Cluster
metadata:
  name: vks-test01
  namespace: vks-ns01
spec:
  clusterNetwork:
    pods:
      cidrBlocks: ["10.244.0.0/16"]
    services:
      cidrBlocks: ["10.97.0.0/16"]
    serviceDomain: cluster.local
  topology:
    classRef:
      name: builtin-generic-v3.7.0
      namespace: vmware-system-vks-public
    version: v1.34.9+vmware.2-vkr.4
    controlPlane:
      replicas: 1
    workers:
      machineDeployments:
      - class: node-pool
        name: np1
        replicas: 1
    variables:
    - name: vmClass
      value: best-effort-medium
    - name: storageClass
      value: vcf-m01-cl01-vsan-storage-policy
    - name: osConfiguration
      value:
        trust:
          additionalTrustedCAs:
          - caCert:
              content: |
