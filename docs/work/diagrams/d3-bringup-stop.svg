ring-up — run to NSX, abort before VCF Management Platform</text><rect x="30" y="110" width="220" height="170" rx="12" fill="#61A60E" fill-opacity="1"/><text x="140.0" y="160" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">M1</text><text x="140.0" y="198" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Deploy vCenter</text><text x="140.0" y="260" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SUCCESS</text><rect x="263" y="110" width="220" height="170" rx="12" fill="#61A60E" fill-opacity="1"/><text x="373.0" y="160" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">M2</text><text x="373.0" y="198" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Deploy SDDC</text><text x="373.0" y="222" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Manager</text><text x="373.0" y="260" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SUCCESS</text><rect x="496" y="110" width="220" height="170" rx="12" fill="#61A60E" fill-opacity="1"/><text x="606.0" y="160" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">M3</text><text x="606.0" y="198" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Configure vSphere</text><text x="606.0" y="222" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">cluster</text><text x="606.0" y="260" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SUCCESS</text><rect x="729" y="110" width="220" height="170" rx="12" fill="#61A60E" fill-opacity="1"/><text x="839.0" y="160" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">M4</text><text x="839.0" y="198" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Deploy and</text><text x="839.0" y="222" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">configure NSX</text><text x="839.0" y="260" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">SUCCESS</text><rect x="962" y="110" width="220" height="170" rx="12" fill="#A6192E" fill-opacity="1"/><text x="1072.0" y="160" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">M5</text><text x="1072.0" y="198" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">VCF Management</text><text x="1072.0" y="222" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Platform (VSP)</text><text x="1072.0" y="260" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">ABORTED (by design)</text><rect x="1195" y="110" width="220" height="170" rx="12" fill="#B8B8B8" fill-opacity="1"/><text x="1305.0" y="160" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">M6</text><text x="1305.0" y="198" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Operations</text><text x="1305.0" y="222" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">appliance</text><text x="1305.0" y="260" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">NOT STARTED</text><rect x="1428" y="110" width="220" height="170" rx="12" fill="#B8B8B8" fill-opacity="1"/><text x="1538.0" y="160" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="34" fill="#FFFFFF" font-weight="bold" text-anchor="middle">M7</text><text x="1538.0" y="198" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">VCF Management</text><text x="1538.0" y="222" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="16" fill="#FFFFFF" font-weight="bold" text-anchor="middle">Services</text><text x="1538.0" y="260" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="15" fill="#FFFFFF" font-weight="bold" text-anchor="middle">NOT STARTED</text><text x="30" y="330" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="20" fill="#4A4A4A" font-weight="bold" text-anchor="start">Why abort instead of omitting? — validation rejects a spec without vspClusterSpec:</text><text x="30" y="360" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#A6192E" font-weight="normal" text-anchor="start">&quot;VCF service runtime specification must be present in the SDDC specification&quot; → keep the full spec, stop the run.</text><rect x="30" y="392" width="1620" height="300" rx="12" fill="#E8F0F4" fill-opacity="1"/><text x="50" y="426" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="20" fill="#1D428A" font-weight="bold" text-anchor="start">Abort watcher (vks-airgap/scripts/abort_watcher.py) — trigger and actions</text><text x="60" y="466" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="17" fill="#4A4A4A" font-weight="bold" text-anchor="start">Trigger: subtask #272 &#x27;Deploy VCF Management Services via SDDC Manager&#x27; leaves INITIALIZED (M4 already done, domain m01 ACTIVE)</text><text x="60" y="502" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="17" fill="#4A4A4A" font-weight="normal" text-anchor="start">1.  VCF Installer 120.2 :   systemctl stop domainmanager      → no M6 / M7</text><text x="60" y="538" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="17" fill="#4A4A4A" font-weight="normal" text-anchor="start">2.  SDDC Manager 120.4 :    systemctl restart domainmanager   → in-flight VSP task ends ORCH_TASK_INTERRUPTED</text><text x="60" y="574" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="17" fill="#4A4A4A" font-weight="normal" text-anchor="start">3.  destroy any vsp01-* / vcf-services-runtime-template VMs  (none existed — aborted in time)</text><text x="60" y="610" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="17" fill="#4A4A4A" font-weight="normal" text-anchor="start">4.  VCF Installer :         systemctl start domainmanager     (installer stays reusable)</text><text x="60" y="646" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="17" fill="#A6192E" font-weight="normal" text-anchor="start">Gotcha: not-yet-started subtasks report status INITIALIZED — treat as idle or the watcher fires immediately</text><rect x="30" y="712" width="790" height="300" rx="12" fill="#FFFFFF" fill-opacity="1" stroke="#61A60E" stroke-width="2.5"/><text x="50" y="746" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="20" fill="#61A60E" font-weight="bold" text-anchor="start">Result (1 h 45 min)</text><text x="60" y="790" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#4A4A4A" font-weight="normal" text-anchor="start">•  vCenter 120.3 · SDDC Manager 120.4 · NSX 120.11</text><text x="60" y="830" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#4A4A4A" font-weight="normal" text-anchor="start">•  vSAN vcf-m01-cl01-ds-vsan01 (FTT=0)</text><text x="60" y="870" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#4A4A4A" font-weight="normal" text-anchor="start">•  vDS vcf-m01-cl01-vds01 (MTU 9000) + NSX TEP</text><text x="60" y="910" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#4A4A4A" font-weight="normal" text-anchor="start">•  Only 3 VMs: vcsa, sddc, nsx01 — no VSP / VCFMS</text><rect x="860" y="712" width="790" height="300" rx="12" fill="#FFFFFF" fill-opacity="1" stroke="#E68C28" stroke-width="2.5"/><text x="880" y="746" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="20" fill="#E68C28" font-weight="bold" text-anchor="start">Unavoidable / side effects</text><text x="890" y="790" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#4A4A4A" font-weight="normal" text-anchor="start">•  SDDC Manager is deployed (M2, before NSX)</text><text x="890" y="830" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#4A4A4A" font-weight="normal" text-anchor="start">•  Bring-up record: COMPLETED_WITH_FAILURE (M5)</text><text x="890" y="870" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#4A4A4A" font-weight="normal" text-anchor="start">•  SDDC Manager task &#x27;Creating VCF services runtime&#x27; = Failed</text><text x="890" y="910" font-family="Arial, 'Microsoft JhengHei', sans-serif" font-size="18" fill="#4A4A4A" font-weight="normal" text-anchor="start">•  NSX VPC external IP block = 192.168.120.0/24 — do not create VPCs</text></svg>